name: Bauen und veröffentlichen

on:
  push:
    # Der Gruppen-Branch landet in einem eigenen Testordner (siehe unten) –
    # die Fassung auf main bleibt davon unberuehrt.
    branches: [main, claude/dazzling-cori-ss0ls8]
  pull_request:
  workflow_dispatch:

# Zwei Deployments gleichzeitig wuerden sich im Zielverzeichnis in die Quere kommen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-24.04
    env:
      # Secrets gehen nicht direkt in eine if-Bedingung, eine Umgebungsvariable schon.
      HAT_TESTZIEL: ${{ secrets.DEPLOY_PATH_GRUPPEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Der Gruppen-Server: Syntax aller PHP-Dateien und ein Durchlauf gegen
      # SQLite im Speicher. PHP ist auf den Runnern vorinstalliert.
      - name: PHP prüfen
        run: |
          for datei in server/api/*.php server/tests/*.php server/*.php; do php -l "$datei"; done
          php server/tests/test.php

      # Der Deploy-Schritt selbst laeuft bei einem Pull Request nie mit. Diese
      # Pruefung faengt deshalb nur Syntaxfehler – das Zusammenspiel mit dem
      # Server bleibt erst beim Lauf auf main sichtbar.
      - name: Deploy-Skript auf Syntax prüfen
        run: bash -n tools/deploy.sh

      - name: Bauen
        run: npm run build

      # Damit die Veröffentlichung nie an GitHub Actions haengt: jeder Build
      # liegt zusaetzlich als herunterladbares Archiv bereit.
      - uses: actions/upload-artifact@v4
        with:
          name: huntkit-dist
          path: dist/
          retention-days: 90

      - name: lftp installieren
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || env.HAT_TESTZIEL == 'true')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lftp

      - name: Auf den Webspace laden
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: tools/deploy.sh dist

      # Testumgebung fuer die Gruppen: derselbe Webspace, eigener Ordner.
      # Ohne das Secret DEPLOY_PATH_GRUPPEN passiert hier nichts.
      - name: Gruppen-Branch in den Testordner laden
        if: github.ref == 'refs/heads/claude/dazzling-cori-ss0ls8' && github.event_name != 'pull_request' && env.HAT_TESTZIEL == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_GRUPPEN }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: tools/deploy.sh dist
